<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>PulsarTrade — Converter</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<script src="/static/nav.js"></script>
<body>
   <nav id="top-nav">
    <h1>PulsarTrade</h1>
    <div id="nav-links">
        <a href="/home">Home</a>
        <a href="/strategies">Strategies</a>
        <a href="/converter">Converter</a>
        <a href="/news">News</a>
        <a href="/aboutcrypto">About</a>
    </div>
</nav>
    <div class="container">
                <section class="converter-card">
            <p class="kicker">Конвертер</p>
            <h2>Крипта в крипту</h2>

            <label for="amount">Сумма</label>
            <input type="number" id="amount" value="1" min="0" step="any">

            <label for="coin-search">Поиск</label>
            <input type="search" id="coin-search" placeholder="Найти монету: BTC, SOL, PEPE..." autocomplete="off">

            <div class="converter-row">
                <div class="coin-box">
                    <label>Из</label>
                    <button type="button" class="coin-btn" id="from-btn">BTC</button>
                    <input type="hidden" id="from-currency" value="BTC">
                    <div class="coin-menu" id="from-menu"></div>
                </div>
                <button type="button" id="swap-btn">⇄</button>
                <div class="coin-box">
                    <label>В</label>
                    <button type="button" class="coin-btn" id="to-btn">USDT</button>
                    <input type="hidden" id="to-currency" value="USDT">
                    <div class="coin-menu" id="to-menu"></div>
                </div>
            </div>

            <button type="button" id="convert-btn">Конвертировать</button>
            <p id="convert-result">Введи сумму и нажми кнопку</p>
        </section>
    </div>

    <script src="/static/converter.js"></script>
    <script src="/static/nav.js"></script>
</body>
</html>
